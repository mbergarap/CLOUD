name: terraform

# Valida el codigo en cada push y pull request. No necesita credenciales de AWS:
# usa `init -backend=false`, por lo que no toca el estado remoto ni crea recursos.
on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
      - name: Formato
        run: terraform fmt -check -recursive
      - name: Init sin backend
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
