apiVersion: apps/v1
kind: Deployment
metadata:
  name: k3s-nginx-test
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k3s-nginx-test
  template:
    metadata:
      labels:
        app: k3s-nginx-test
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: k3s-nginx-test
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: k3s-nginx-test
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: k3s-nginx-test
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP